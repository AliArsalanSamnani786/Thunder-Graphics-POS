apiVersion: apps/v1
kind: Deployment
metadata:
  name: thunder-pos-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: thunder-pos-api
  template:
    metadata:
      labels:
        app: thunder-pos-api
    spec:
      containers:
        - name: api
          image: thunder-pos-api:latest
          ports:
            - containerPort: 3001
          envFrom:
            - secretRef:
                name: thunder-pos-api-secrets
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10

